<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Programme — A* Accelerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --forest:#0F4D3E;
    --lime:#A6CE39;
    --seafoam:#C7EEDD;
    --sky:#7EC8FF;
    --navy:#0B1D2D;
    --gray:#F2F6F5;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--navy);
    background:var(--white);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    line-height:1.08;
    letter-spacing:-0.01em;
  }
  em{
    font-style:italic;
    color:var(--forest);
    font-weight:500;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 32px;}

  /* Header — Geometric Split */
  header{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:26px 0;
    max-width:1180px; margin:0 auto;
  }
  .logo{display:flex; align-items:center; gap:12px; min-width:0; padding-left:32px;}
  .logo-mark{width:34px; height:auto; display:block; flex-shrink:0;}
  .logo-text-img{height:29px; width:auto; display:block; max-width:100%;}
  .header-rule{width:1px; align-self:stretch; background:var(--seafoam); margin:6px 0;}
  .header-nav{display:flex; align-items:center; justify-content:flex-end; padding-right:32px;}
  .menu-btn{
    display:flex; align-items:center; gap:10px;
    background:var(--gray); padding:9px 8px 9px 16px; border-radius:2px;
    cursor:pointer; border:none;
  }
  .menu-tick{width:9px; height:2px; background:var(--lime); transform:rotate(-25deg); flex-shrink:0;}
  .menu-label{
    font-size:11.5px; letter-spacing:0.07em; text-transform:uppercase;
    font-weight:700; color:var(--navy); white-space:nowrap;
  }
  .menu-btn .bars{
    display:flex; flex-direction:column; gap:3px; flex-shrink:0;
    background:var(--forest); padding:8px 9px; border-radius:2px;
  }
  .menu-btn .bars span{width:11px; height:1.4px; background:var(--white);}

  /* Hero */
  .hero{
    display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:40px;
    padding:34px 32px 100px;
    max-width:1180px; margin:0 auto;
  }
  .hero-copy .eyebrow-rule{width:52px; height:3px; background:var(--lime); margin:22px 0;}
  .hero-copy h1{font-size:52px;}
  .hero-copy .quote-line{margin-top:22px; font-size:16px; color:#3d5450; max-width:380px;}
  .hero-copy .quote-line q{
    display:block; margin-top:6px; font-family:'Fraunces', serif; font-style:italic;
    font-size:19px; color:var(--navy);
  }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 28px; border-radius:2px;
    font-weight:600; font-size:14.5px; letter-spacing:0.01em;
    border:none; cursor:pointer;
    transition:background .2s ease, transform .2s ease;
  }
  .btn-primary{background:var(--sky); color:var(--navy); margin-top:34px;}
  .btn-primary:hover{background:#5fb8ff;}
  .btn-outline{background:var(--sky); color:var(--navy); border:none;}
  .btn-outline:hover{background:#5fb8ff;}
  .btn svg{width:16px; height:16px; transition:transform .2s ease;}
  .btn:hover svg{transform:translateX(3px);}

  .art{position:relative; overflow:hidden; border-radius:4px;}
  .art img{width:100%; height:100%; object-fit:cover; display:block;}
  .mask-right{clip-path:polygon(16% 0%, 100% 0%, 100% 100%, 0% 100%);}
  .mask-left{clip-path:polygon(0% 0%, 100% 0%, 84% 100%, 0% 100%);}

  .hero-art{position:relative; aspect-ratio:4/5;}
  .hero-art .star{
    position:absolute; top:6%; right:8%; width:34px; height:34px; color:var(--sky);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.15)); z-index:2;
  }

  /* Subject cards */
  .subjects{
    display:grid; grid-template-columns:1fr 1px 1fr; gap:56px;
    padding:0 32px 110px; max-width:1180px; margin:0 auto; align-items:start;
  }
  .subjects-divider{background:var(--seafoam); align-self:stretch;}
  .subject-card{padding:6px 0;}
  .subject-card .tick{width:16px; height:3px; background:var(--lime); margin-bottom:20px; transform:rotate(-20deg); transform-origin:left;}
  .subject-card h3{font-size:27px; margin-bottom:4px;}
  .subject-card .field{font-size:13px; color:#5c6d69; margin-bottom:22px;}
  .subject-card .level{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 0; border-top:1px solid #e7ebe9; font-size:15px; font-weight:500;
  }
  .subject-card .level svg{width:16px; height:16px; color:var(--sky);}

  /* Understanding section */
  .understand{
    display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center;
    padding:0 32px 120px; max-width:1180px; margin:0 auto;
  }
  .understand .art{aspect-ratio:6/5;}
  .understand .tick{width:16px; height:3px; background:var(--lime); margin-bottom:20px; transform:rotate(-20deg); transform-origin:left;}
  .understand h2{font-size:36px; margin-bottom:16px;}
  .understand p{color:#4a5b57; font-size:15.5px; max-width:420px;}

  /* Accelerator list */
  .accelerator{
    padding:0 32px 120px; max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center;
  }
  .accelerator .eyebrow{font-size:12px; letter-spacing:0.1em; color:var(--lime); font-weight:700; text-transform:uppercase;}
  .accelerator h2{font-size:34px; margin:8px 0 20px;}
  .accelerator .rule{width:44px; height:3px; background:var(--lime); margin-bottom:22px;}
  .accel-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0; border-bottom:1px solid #e6ebe9;
  }
  .accel-item .t{font-weight:600; font-size:15.5px;}
  .accel-item .s{font-size:13px; color:#6b7c78; margin-top:2px;}
  .accel-item svg{width:17px; height:17px; color:var(--sky); flex-shrink:0;}
  .accelerator .art{aspect-ratio:5/6;}

  /* Process */
  .process{background:var(--navy); color:var(--white); padding:80px 32px;}
  .process .grid{
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns:repeat(5,1fr); gap:0;
  }
  .process .step{padding:0 26px; border-left:1px solid rgba(255,255,255,.12);}
  .process .step:first-child{border-left:none; padding-left:0;}
  .process .step .num{font-family:'Fraunces', serif; font-size:26px; color:var(--lime); margin-bottom:12px;}
  .process .step .t{font-weight:600; font-size:16px; margin-bottom:6px;}
  .process .step .s{font-size:13px; color:#a9b8b3;}

  /* Closing CTA */
  .closing{
    display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:64px;
    padding:120px 32px; max-width:1180px; margin:0 auto;
  }
  .closing .tick{width:16px; height:3px; background:var(--lime); margin-bottom:20px; transform:rotate(-20deg); transform-origin:left;}
  .closing h2{font-size:38px;}
  .closing p{color:#4a5b57; font-size:15.5px; margin:18px 0 30px; max-width:380px;}
  .closing .art{aspect-ratio:5/4;}

  footer{
    background:var(--navy); color:var(--white);
    padding:26px 32px; text-align:center;
    font-size:12.5px; letter-spacing:0.18em; text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:14px;
  }
  footer .dot{width:3px; height:3px; background:var(--lime); border-radius:50%;}

  @media (max-width:860px){
    .hero, .subjects, .understand, .accelerator, .closing{grid-template-columns:1fr;}
    .hero{padding-top:6px;}
    .hero-art{order:-1;}
    .hero-copy h1{font-size:38px;}
    .process .grid{grid-template-columns:repeat(2,1fr); row-gap:36px;}
    .process .step{border-left:none; padding:0 0 0 20px; border-left:1px solid rgba(255,255,255,.12);}
    .process .step:nth-child(odd){border-left:none; padding-left:0;}
    .understand .art, .accelerator .art, .closing .art{order:-1;}
    header{padding:20px 0;}
    .logo{padding-left:20px; min-width:0;}
    .logo-text-img{height:24px;}
    .header-nav{padding-right:20px; min-width:0;}
    .subjects{gap:0;}
    .subjects-divider{display:none;}
    .subject-card + .subject-card{border-top:1px solid var(--seafoam); margin-top:8px; padding-top:34px;}
  }
  @media (max-width:400px){
    .menu-label{display:none;}
    .menu-btn{padding:9px;}
  }

/* Auth / booking / dashboard shared components */
.page-shell{max-width:520px; margin:0 auto; padding:60px 32px 100px;}
.page-shell.wide{max-width:760px;}
.page-shell h1{font-size:32px; margin-bottom:10px;}
.page-shell .lede{color:#4a5b57; font-size:15px; margin-bottom:36px;}

.field-group{margin-bottom:20px;}
.field-group label{display:block; font-size:13px; font-weight:600; margin-bottom:7px; color:var(--navy);}
.field-group input, .field-group select{
  width:100%; padding:13px 14px; border:1.5px solid #dde5e2; border-radius:2px;
  font-family:'Inter', sans-serif; font-size:14.5px; color:var(--navy); background:var(--white);
}
.field-group input:focus, .field-group select:focus{
  outline:none; border-color:var(--forest);
}

.btn-block{width:100%; justify-content:center; margin-top:8px;}
.btn:disabled{opacity:.55; cursor:not-allowed;}

.form-note{font-size:13px; color:#6b7c78; margin-top:18px; text-align:center;}
.form-note a{color:var(--forest); font-weight:600;}

.alert{
  padding:12px 14px; border-radius:2px; font-size:13.5px; margin-bottom:20px; display:none;
}
.alert.show{display:block;}
.alert.error{background:#fdecec; color:#9b2c2c;}
.alert.success{background:var(--seafoam); color:var(--forest);}

.dash-header{
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom:20px; margin-bottom:30px; border-bottom:1px solid #e6ebe9;
}
.dash-header .who{font-size:14px; color:#6b7c78;}
.dash-header button{
  background:none; border:none; color:var(--forest); font-weight:600; font-size:13.5px; cursor:pointer;
}

.booking-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; background:var(--gray); border-radius:2px; margin-bottom:12px;
}
.booking-row .t{font-weight:600; font-size:14.5px;}
.booking-row .s{font-size:12.5px; color:#6b7c78; margin-top:2px;}
.booking-row .status{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
  padding:5px 10px; border-radius:2px; background:var(--seafoam); color:var(--forest);
}
.empty-state{
  text-align:center; padding:50px 20px; color:#6b7c78; font-size:14px;
}

/* Split panel layout for login/booking */
.auth-grid{display:grid; grid-template-columns:1fr 1fr; min-height:calc(100vh - 110px);}
.auth-grid .page-shell{margin:0 auto; display:flex; flex-direction:column; justify-content:center; padding:60px 60px; width:100%;}
.auth-panel{position:relative; overflow:hidden; background:var(--navy);}
.auth-panel img{width:100%; height:100%; object-fit:cover; opacity:.92;}
.auth-panel::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(200deg, rgba(11,29,41,0) 40%, rgba(11,29,41,.55) 100%);
  z-index:1;
}
.auth-panel .quote{
  position:absolute; left:36px; right:36px; bottom:36px; z-index:2; color:#fff;
}
.auth-panel .quote .tick{width:16px; height:3px; background:var(--lime); margin-bottom:16px; transform:rotate(-20deg); transform-origin:left;}
.auth-panel .quote p{font-family:'Fraunces', serif; font-style:italic; font-size:22px; line-height:1.3;}
.auth-panel .quote span{display:block; margin-top:10px; font-family:'Inter',sans-serif; font-style:normal; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--sky); font-weight:600;}

@media (max-width:900px){
  .auth-grid{grid-template-columns:1fr; min-height:0;}
  .auth-panel{display:none;}
  .auth-grid .page-shell{padding:40px 24px 80px;}
}

/* Booking form: sections + option cards */
.page-shell .tick{width:16px; height:3px; background:var(--lime); margin-bottom:16px; transform:rotate(-20deg); transform-origin:left;}
.form-eyebrow{
  display:block; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
  font-weight:700; color:var(--forest); margin-bottom:10px;
}
.form-section{margin-bottom:36px; padding-bottom:8px;}
.form-section-label{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
  color:#8b968f; margin-bottom:16px;
}

.option-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.option-card{
  position:relative; display:block; border:1.5px solid #dde5e2;
  padding:16px 16px 16px 18px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
}
.option-card input{position:absolute; opacity:0; width:0; height:0;}
.option-tick{
  display:block; width:14px; height:3px; background:#c6d0cc; margin-bottom:12px;
  transform:rotate(-20deg); transform-origin:left; transition:background .15s ease;
}
.option-t{display:block; font-weight:600; font-size:14.5px; color:var(--navy);}
.option-s{display:block; font-size:12px; color:#6b7c78; margin-top:2px;}
.option-card:hover{border-color:#b9c6c1;}
.option-card:has(input:checked){
  border-color:var(--sky); background:rgba(126,200,255,.08);
}
.option-card:has(input:checked) .option-tick{background:var(--sky);}
.option-card.is-checked{border-color:var(--sky); background:rgba(126,200,255,.08);}
.option-card.is-checked .option-tick{background:var(--sky);}

@media (max-width:520px){
  .option-grid{grid-template-columns:1fr;}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<script>
  document.querySelectorAll('input[name="programme"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.querySelectorAll('.option-card').forEach(card => card.classList.remove('is-checked'));
      radio.closest('.option-card').classList.add('is-checked');
    });
  });

  const form = document.getElementById('bookingForm');
  const errorAlert = document.getElementById('errorAlert');
  const successAlert = document.getElementById('successAlert');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorAlert.classList.remove('show');
    successAlert.classList.remove('show');

    const selected = form.querySelector('input[name="programme"]:checked');
    if (!selected) {
      errorAlert.textContent = 'Please choose a programme.';
      errorAlert.classList.add('show');
      return;
    }
    const [subject, level] = selected.value.split('|');

    submitBtn.disabled = true;

    const { data: { session } } = await supabaseClient.auth.getSession();

    const payload = {
      student_name: document.getElementById('studentName').value.trim(),
      parent_email: document.getElementById('parentEmail').value.trim(),
      parent_phone: document.getElementById('parentPhone').value.trim(),
      subject: subject,
      level: level,
      notes: document.getElementById('notes').value.trim(),
      status: 'pending',
      user_id: session ? session.user.id : null
    };

    try {
      const { error } = await supabaseClient.from('bookings').insert([payload]);
      if (error) throw error;
      successAlert.textContent = "Request received — we'll be in touch shortly to confirm.";
      successAlert.classList.add('show');
      form.reset();
    } catch (err) {
      errorAlert.textContent = err.message || 'Something went wrong. Please try again.';
      errorAlert.classList.add('show');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
